name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make vet
      - run: make test
      - run: make build
      - name: Smoke test (index and query this repo)
        run: |
          ./bin/codeweft index .
          ./bin/codeweft query search code | grep -q "internal/"
