name: npm publish

# Publishes the npm packages of a release that already exists, from the
# archives attached to it. For when the npm job of a release failed part
# way: run it from the Actions tab with the release's tag. Packages already
# on npm are skipped, so it carries on from where the release stopped.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.8.0
        required: true

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  npm:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Download the release archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "not a release tag: $TAG"; exit 1 ;; esac
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.tar.gz' --pattern '*.zip' --dir dist
      - name: Publish
        run: node scripts/npm/publish.mjs --dist dist --version "$TAG"
