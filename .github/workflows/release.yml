name: release

# Pushing a tag such as v0.7.0 builds codeweft for Linux, macOS and Windows
# and publishes the archives, with checksums, as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # cgo (SQLite, tree-sitter) needs C and C++ compilers for the
          # target (the YAML grammar has a C++ scanner, and Go then links
          # with the C++ compiler). Linux and Windows are linked statically,
          # so the binary runs on any distribution and needs no MinGW DLLs.
          - { runner: ubuntu-latest, goos: linux, goarch: amd64, cc: gcc, cxx: g++, static: true, smoke: true }
          - { runner: ubuntu-latest, goos: linux, goarch: arm64, cc: aarch64-linux-gnu-gcc, cxx: aarch64-linux-gnu-g++, apt: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu, static: true }
          - { runner: ubuntu-latest, goos: windows, goarch: amd64, cc: x86_64-w64-mingw32-gcc, cxx: x86_64-w64-mingw32-g++, apt: gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64, ext: .exe, static: true }
          - { runner: macos-latest, goos: darwin, goarch: arm64, cc: clang, cxx: clang++, smoke: true }
          - { runner: macos-latest, goos: darwin, goarch: amd64, cc: clang -arch x86_64, cxx: clang++ -arch x86_64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install cross compiler
        if: matrix.apt
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}
      - name: Build
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          ldflags="-s -w -X github.com/anjanikumarjangid/codeweft/internal/server.Version=${version}"
          tags="sqlite_fts5 sqlite_omit_load_extension"
          if [ "${{ matrix.static }}" = "true" ]; then
            ldflags="${ldflags} -linkmode external -extldflags -static"
            tags="${tags} netgo osusergo"
          fi
          mkdir -p out
          go build -trimpath -tags "${tags}" -ldflags "${ldflags}" -o "out/codeweft${{ matrix.ext }}" ./cmd/codeweft
      - name: Smoke test
        if: matrix.smoke
        run: |
          ./out/codeweft version | grep -q "${GITHUB_REF_NAME#v}"
          ./out/codeweft index --db /tmp/sample.db testdata/sample
          ./out/codeweft query --db /tmp/sample.db rate limiter | grep -q TokenBucket
      - name: Package
        run: |
          name="codeweft_${GITHUB_REF_NAME#v}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p "dist/${name}"
          cp "out/codeweft${{ matrix.ext }}" LICENSE NOTICE README.md "dist/${name}/"
          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -qr "${name}.zip" "${name}"
          else
            tar -czf "${name}.tar.gz" "${name}"
          fi
          rm -r "${name}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > checksums.txt && cat checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes

  # npm: `npx codeweft`. Needs the NPM_TOKEN secret (an automation token
  # allowed to publish codeweft and codeweft-*); skipped without it.
  npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.NODE_AUTH_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.NODE_AUTH_TOKEN != ''
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        if: env.NODE_AUTH_TOKEN != ''
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        if: env.NODE_AUTH_TOKEN != ''
        run: node scripts/npm/publish.mjs --dist dist --version "${GITHUB_REF_NAME}"

  # Homebrew: `brew install <owner>/codeweft/codeweft`. Updates the formula
  # in the <owner>/homebrew-codeweft repository; needs the HOMEBREW_TAP_TOKEN
  # secret (a token with write access to that repository); skipped without.
  homebrew:
    needs: release
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.TAP_TOKEN != ''
      - uses: actions/download-artifact@v4
        if: env.TAP_TOKEN != ''
        with:
          path: dist
          merge-multiple: true
      - uses: actions/checkout@v4
        if: env.TAP_TOKEN != ''
        with:
          repository: ${{ github.repository_owner }}/homebrew-codeweft
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Update the formula
        if: env.TAP_TOKEN != ''
        run: |
          mkdir -p tap/Formula
          scripts/homebrew/formula.sh "${GITHUB_REF_NAME}" dist > tap/Formula/codeweft.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/codeweft.rb
          git commit -m "codeweft ${GITHUB_REF_NAME#v}"
          git push
