name: image

# Publishes the codeweft server image to the GitHub Container Registry:
# ghcr.io/<owner>/codeweft:edge from main, and :X.Y.Z, :X.Y and :latest
# from a release tag vX.Y.Z. Public images need no token to pull.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths: [Dockerfile, .dockerignore, .github/workflows/image.yml]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/codeweft
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=codeweft
            org.opencontainers.image.description=Self-hostable MCP server giving AI coding agents structured context about your code and services
            org.opencontainers.image.licenses=Apache-2.0
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        if: github.event_name == 'pull_request'
        run: |
          docker buildx build --load -t codeweft:test .
          docker run --rm codeweft:test version
          docker run --rm -e CODEWEFT_REPOS=/nonexistent codeweft:test server 2>&1 | grep -q "CODEWEFT_API_TOKENS"
