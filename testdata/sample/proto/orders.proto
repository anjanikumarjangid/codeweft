syntax = "proto3";

package shop.orders.v1;

option go_package = "example.com/sample/gen/ordersv1";
option java_package = "com.shop.orders.grpc";

// OrderService reads orders; served by checkout (Go).
service OrderService {
  rpc GetOrder(GetOrderRequest) returns (Order);
  rpc ListOrders(ListOrdersRequest) returns (stream Order);
}

// RefundService refunds orders; served by the Java orders service.
service RefundService {
  rpc Refund(RefundRequest) returns (Order);
}

message GetOrderRequest { string id = 1; }
message ListOrdersRequest { string customer_id = 1; }
message RefundRequest { string id = 1; }

message Order {
  string id = 1;
  int64 cents = 2;
  // Line is one item of the order.
  message Line {
    string sku = 1;
  }
  repeated Line lines = 3;
}
