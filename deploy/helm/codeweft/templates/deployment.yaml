{{- if and (not .Values.repos) (not .Values.githubOrg) }}
{{- fail "set repos or githubOrg" }}
{{- end }}
{{- $db := include "codeweft.usesDatabase" . }}
{{- if and .Values.existingSecret .Values.database.url }}
{{- fail "with existingSecret, keep the database URL in a Secret too: set database.existingSecret instead of database.url" }}
{{- end }}
{{- if and (gt (int .Values.replicaCount) 1) (not $db) }}
{{- fail "replicaCount above 1 needs database.url or database.existingSecret: SQLite indexes live on one pod's volume" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "codeweft.fullname" . }}
  labels: {{- include "codeweft.labels" . | nindent 4 }}
spec:
  {{- if $db }}
  # Indexes are in PostgreSQL: replicas share them, and take turns indexing.
  replicas: {{ .Values.replicaCount }}
  {{- else }}
  # One replica: the index is SQLite on a ReadWriteOnce volume, written by
  # this process only. Recreate so two pods never share the volume.
  replicas: 1
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels: {{- include "codeweft.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "codeweft.selector" . | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: codeweft
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [server]
          ports:
            - name: http
              containerPort: 8080
          env:
            - {name: CODEWEFT_DATA_DIR, value: /data}
            # The root filesystem is read-only: git's home and SQLite's
            # temporary files go to an emptyDir.
            - {name: HOME, value: /tmp}
            - {name: TMPDIR, value: /tmp}
            - {name: CODEWEFT_ADDR, value: ":8080"}
            - {name: CODEWEFT_REPOS, value: {{ .Values.repos | quote }}}
            - {name: CODEWEFT_GITHUB_ORG, value: {{ .Values.githubOrg | quote }}}
            - {name: CODEWEFT_GITHUB_INCLUDE_FORKS, value: {{ .Values.includeForks | quote }}}
            - {name: CODEWEFT_SYNC_INTERVAL, value: {{ .Values.syncInterval | quote }}}
            - {name: CODEWEFT_SYNC_CONCURRENCY, value: {{ .Values.syncConcurrency | quote }}}
            - {name: CODEWEFT_ALLOW_UNAUTHENTICATED, value: {{ .Values.allowUnauthenticated | quote }}}
            {{- with .Values.githubURL }}
            - {name: CODEWEFT_GITHUB_URL, value: {{ . | quote }}}
            {{- end }}
            {{- with .Values.githubAPIURL }}
            - {name: CODEWEFT_GITHUB_API_URL, value: {{ . | quote }}}
            {{- end }}
            {{- with .Values.githubClientID }}
            - {name: CODEWEFT_GITHUB_CLIENT_ID, value: {{ . | quote }}}
            {{- end }}
            {{- with .Values.githubOAuthScope }}
            - {name: CODEWEFT_GITHUB_OAUTH_SCOPE, value: {{ . | quote }}}
            {{- end }}
            {{- with .Values.publicURL }}
            - {name: CODEWEFT_PUBLIC_URL, value: {{ . | quote }}}
            {{- end }}
            {{- range $key := list "GITHUB_TOKEN" "GITHUB_WEBHOOK_SECRET" "CODEWEFT_API_TOKENS" "CODEWEFT_GITHUB_CLIENT_SECRET" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef: {name: {{ include "codeweft.secretName" $ }}, key: {{ $key }}, optional: true}
            {{- end }}
            {{- if .Values.database.existingSecret }}
            - name: CODEWEFT_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: {{ .Values.database.existingSecret }}, key: {{ .Values.database.secretKey }}}
            {{- else if .Values.database.url }}
            - name: CODEWEFT_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: {{ include "codeweft.fullname" . }}, key: CODEWEFT_DATABASE_URL}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          {{- if $db }}
          emptyDir: {}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "codeweft.fullname" . }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
