{{- if not .Values.existingSecret }}
{{- if and (not .Values.apiTokens) (not .Values.allowUnauthenticated) (not .Values.githubClientID) }}
{{- fail "set apiTokens (or existingSecret), githubClientID and githubClientSecret for sign-in with GitHub, or allowUnauthenticated=true if something in front authenticates clients" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "codeweft.fullname" . }}
  labels: {{- include "codeweft.labels" . | nindent 4 }}
type: Opaque
stringData:
  GITHUB_TOKEN: {{ .Values.githubToken | quote }}
  GITHUB_WEBHOOK_SECRET: {{ .Values.webhookSecret | quote }}
  CODEWEFT_API_TOKENS: {{ .Values.apiTokens | quote }}
  CODEWEFT_GITHUB_CLIENT_SECRET: {{ .Values.githubClientSecret | quote }}
  {{- with .Values.database.url }}
  CODEWEFT_DATABASE_URL: {{ . | quote }}
  {{- end }}
{{- end }}
