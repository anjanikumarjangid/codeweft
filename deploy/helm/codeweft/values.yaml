image:
  repository: ghcr.io/anjanikumarjangid/codeweft
  tag: ""            # defaults to the chart's appVersion
  pullPolicy: IfNotPresent

# Repositories to serve: owner/name, Git URLs, separated by spaces.
repos: ""
# Or (also) every repository of a GitHub organization or user.
githubOrg: ""
includeForks: false
syncInterval: 10m
syncConcurrency: 2
# For GitHub Enterprise Server.
githubURL: ""
githubAPIURL: ""

# Secrets: name an existing Secret with the keys GITHUB_TOKEN,
# GITHUB_WEBHOOK_SECRET and CODEWEFT_API_TOKENS, or set them below to
# have the chart create one.
existingSecret: ""
githubToken: ""
webhookSecret: ""
apiTokens: ""        # comma-separated
# Serve without tokens: only when something in front authenticates clients.
allowUnauthenticated: false

# Where indexes are kept. By default, SQLite files on the volume below,
# with one replica. Set a PostgreSQL URL (or name a Secret holding one) to
# keep them in PostgreSQL instead: replicaCount may then be more than 1,
# and clones go to an emptyDir, since each pod can fetch its own.
database:
  url: ""            # postgres://user:password@host:5432/codeweft
  existingSecret: "" # or: a Secret with the URL under secretKey
  secretKey: CODEWEFT_DATABASE_URL

replicaCount: 1      # more than 1 needs database.url or database.existingSecret

persistence:          # used only without a database
  size: 10Gi
  storageClass: ""
  accessMode: ReadWriteOnce

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: codeweft.example.com
  tls: []            # e.g. [{secretName: codeweft-tls, hosts: [codeweft.example.com]}]

resources:
  requests: {cpu: 500m, memory: 512Mi}
  limits: {memory: 2Gi}

extraEnv: []         # more environment variables: [{name: ..., value: ...}]
nodeSelector: {}
tolerations: []
affinity: {}
